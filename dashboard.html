<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Quick Med Pune – Sales Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<header><div class="bar">
  <h1>Quick Med <span>Dashboard</span></h1>
  <span><a class="ghost" href="inventory.html">Inventory</a> <a class="ghost" href="index.html">Back to store</a></span>
</div></header>
<main>
  <div class="tools">
    <label>Period
      <select id="range"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select></label>
    <label>Data
      <select id="src"><option value="live">Store orders</option><option value="demo">Demo data</option></select></label>
    <button id="csv">Export orders (CSV)</button>
    <button id="clr" class="danger">Clear store orders</button>
  </div>
  <p id="banner" class="banner" role="status"></p>

  <section class="kpis" id="kpis" aria-label="Key numbers"></section>

  <section class="grid2">
    <div class="card wide"><h2>Revenue by day</h2><div class="cv"><canvas id="cRev" role="img" aria-label="Revenue by day line chart"></canvas></div></div>
    <div class="card"><h2>Sales by category</h2><div class="cv"><canvas id="cCat" role="img" aria-label="Sales by category chart"></canvas></div></div>
  </section>
  <section class="grid2">
    <div class="card"><h2>Top products by revenue</h2><div class="cv"><canvas id="cTop" role="img" aria-label="Top products bar chart"></canvas></div></div>
    <div class="card wide"><h2>Restock soon</h2><div class="scroll"><table id="tStock"></table></div></div>
  </section>
  <section class="card"><h2>Recent orders</h2><div class="scroll"><table id="tOrders"></table></div></section>
</main>
<script src="products.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
